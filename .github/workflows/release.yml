name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build release package
    if: github.repository == 'V0idream/OrbitWheel'
    runs-on: windows-2022
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Check out tag and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require source merged into the default branch
        shell: powershell
        run: |
          git merge-base --is-ancestor HEAD origin/OrbitWheel
          if ($LASTEXITCODE -ne 0) { throw 'Release source must be merged into OrbitWheel first.' }

      - name: Build and verify tag version
        id: package
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Tag must include a product version after v.' }
          $package = & .\scripts\package-release.ps1 -Version $version
          "version=$($package.Version)" >> $env:GITHUB_OUTPUT
          "zip=$($package.ZipPath)" >> $env:GITHUB_OUTPUT
          "checksum=$($package.ChecksumPath)" >> $env:GITHUB_OUTPUT
          "notes=$($package.NotesPath)" >> $env:GITHUB_OUTPUT

      - name: Verify action reliability
        shell: powershell
        run: .\scripts\test-action-reliability.ps1

      - name: Verify settings usability
        shell: powershell
        run: .\scripts\test-settings-usability.ps1

      - name: Upload verified release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.checksum }}
            ${{ steps.package.outputs.notes }}
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Create draft release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: release

      - name: Verify download and create draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          (cd release && sha256sum --check SHA256SUMS.txt)
          options=(--draft --verify-tag --title "OrbitWheel $RELEASE_VERSION")
          if [[ "$RELEASE_VERSION" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "release/OrbitWheel-$RELEASE_VERSION.zip" release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --notes-file release/RELEASE_NOTES.md "${options[@]}"
